name: Update README Timestamp

on:
  schedule:
    - cron: "30 2 * * *"   # runs daily at 2:30 AM UTC — change if you like
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # gives GITHUB_TOKEN push access for this run

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          sed -i "s|<!--LAST_UPDATED-->.*|<!--LAST_UPDATED-->🕒 Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "elakkiyac0203"
          git config user.email "297651581+elakkiyac0203@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update last-updated timestamp"
          git push
